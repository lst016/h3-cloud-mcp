[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h3-cloud-mcp"
version = "0.1.0"
description = "MCP tools for MiniMax H3 via AutoDL Art managed API or private ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2,<3", "httpx[socks]>=0.27,<1"]

[project.scripts]
h3-cloud-mcp = "h3_cloud_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/h3_cloud_mcp"]
